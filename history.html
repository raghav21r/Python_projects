<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-4">
        <div class="data_storage">
            <h2>Your recent URLs</h2>
            {% if build %}
            <table class="table table-dark">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">URLs</th>
                        <th scope="col">Email-Id</th>
                        <th scope="col">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for contents in build %}
                    <tr>
                        <th scope="row">{{loop.index}}</th>
                        <td>{{contents.Your_url}}</td>
                        <td>{{contents.email_id}}</td>
                        <td>
                            <a href="/delete/{{contents.id}}" type="button" class="btn btn-danger btn-sm mx-1">Delete</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="text-muted">No URLs recorded yet. Submit a URL above to get started!</p>
            {% endif %}
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>
</html>
